# Keep Render free tier service alive
# Pings the health endpoint every 12 hours

name: Keep Backend Alive

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Beta API
        run: |
          curl -f https://worksite-api-beta.onrender.com/health || exit 1
          echo "Beta API is alive!"
